# AEGIS-SIGMA Configuration — Personal ARM Deployment
# All secrets live in /etc/aegis-sigma/vault/
# This file contains non-secret configuration values.

# Network
network:
  wireguard_ip: "10.88.0.12"  # This node's WireGuard IP
  c_engine_host: "127.0.0.1"
  c_engine_port: 20129

# LLM Gateway — Security Stack Model Tiers
# Tier 1 (Fast): Gemini 2.5 Flash — classification, triage, rate-limited calls
# Tier 2 (Smart): Gemini 2.5 Pro — deep analysis, uncertain zone only
# Tier 3 (Security): Gemma 4 — on-device, security-focused, call prep
# Tier 4 (Heavy): SambaNova GPT-OSS-120B — deep forensics, teacher LLM
llm:
  base_url: "https://ai.aegis-sigma.com/v1"
  model_shield: "gc/gemini-2.5-flash"      # Tier 1 — fast classifier
  model_soul: "sambanova/gpt-oss-120b"          # Tier 4 — deep clustering
  model_teacher: "gc/gemini-2.5-pro"        # Tier 2 — teacher (uncertain zone)
  model_callprep: "gemini/gemma-4-31b-it"              # Tier 3 — call prep (Nvidia via 9router)

# Email
email:
  from_address: "shield@aegis-sigma.com"
  from_name: "AEGIS-SIGMA Security"

# Strike server (counter-attacks)
strike:
  url: "http://localhost:8443"

# Landing backend (origin server)
landing:
  url: "http://127.0.0.1:8081"

# Feature gates — full production
tier: "enterprise"
features:
  teacher_enabled: true
  auditor_enabled: true
  bridge_enabled: true
  nomen_enabled: true
  active_learning: true
  max_agents: 583
  multi_node: true
  threat_heatmap: true
  team_rbac: true

# Email
email:
  from_address: "shield@example.com"
  from_name: "AEGIS-SIGMA Security"

# Stripe (for quotes/checkouts)
stripe:
  success_url: "https://example.com/quote/success"
  cancel_url: "https://example.com/quote/cancel"

# SMTP fallback (when Brevo/Resend are unavailable)
smtp:
  host: "127.0.0.1"
  port: 25
  from: "shield@example.com"

# Strike server (counter-attacks)
strike:
  url: "http://localhost:8443"

# Landing backend (origin server)
landing:
  url: "http://127.0.0.1:8081"

# Feature gates
tier: "community"  # community | pro | enterprise
features:
  teacher_enabled: false
  auditor_enabled: false
  bridge_enabled: false
  nomen_enabled: false
  active_learning: false
  max_agents: 15
  multi_node: false
  threat_heatmap: false
  team_rbac: false
