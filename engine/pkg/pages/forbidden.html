<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>403 Forbidden | Aegis-SIGMA</title>
<style>
:root{--obsidian:#0B0B0D;--ruby:#CF222E;--text-secondary:#8b949e;--amethyst:#9966CC}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--obsidian);color:#00E5FF;font-family:'Inter',-apple-system,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center}
.container{max-width:500px;padding:40px;text-align:center}
.code{font-size:6rem;font-weight:900;color:var(--ruby);letter-spacing:-4px;margin-bottom:10px}
.msg{font-size:1.1rem;color:var(--text-secondary);margin-bottom:8px}
.detail{font-family:'Courier New',monospace;color:#666;font-size:0.8rem;background:#1a1a2e;padding:10px;border-radius:6px;margin:15px 0;word-break:break-all}
.footer{font-size:0.6rem;color:var(--amethyst);opacity:0.4;margin-top:30px}
</style>
</head>
<body>
<div class="container">
<div class="code">403</div>
<div class="msg">Access denied.</div>
<div class="detail">%s</div>
<div class="footer">Aegis-SIGMA Security</div>
</div>
</body>
</html>
