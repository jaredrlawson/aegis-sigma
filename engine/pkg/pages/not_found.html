<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 Not Found | Aegis-SIGMA</title>
<style>
:root{--obsidian:#0B0B0D;--diamond:#00E5FF;--amethyst:#9966CC;--text-secondary:#8b949e}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--obsidian);color:var(--diamond);font-family:'Inter',-apple-system,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center}
.container{max-width:500px;padding:40px;text-align:center}
.code{font-size:6rem;font-weight:900;background:linear-gradient(135deg,var(--diamond),var(--amethyst));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:-4px;margin-bottom:10px}
.msg{font-size:1.1rem;color:var(--text-secondary);margin-bottom:8px}
.path{font-family:'Courier New',monospace;color:#666;font-size:0.8rem;background:#1a1a2e;padding:10px;border-radius:6px;margin:15px 0;word-break:break-all}
.suggest{font-size:0.8rem;color:var(--text-secondary);margin-top:20px;line-height:1.8}
.suggest a{color:var(--diamond);text-decoration:none}.suggest a:hover{text-decoration:underline}
.footer{font-size:0.6rem;color:var(--amethyst);opacity:0.4;margin-top:30px}
</style>
</head>
<body>
<div class="container">
<div class="code">404</div>
<div class="msg">The page you requested does not exist.</div>
<div class="path">%s</div>
<div class="suggest"><a href="/">Home</a> &middot; <a href="/services">Services</a> &middot; <a href="/pricing">Pricing</a> &middot; <a href="/contact">Contact</a></div>
<div class="footer">Aegis-SIGMA Security</div>
</div>
</body>
</html>
